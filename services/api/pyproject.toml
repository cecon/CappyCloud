[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cappycloud-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

# Explicit package discovery: only include 'app', never 'alembic' or 'tests'
[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.15",
    "mypy>=1.16",
    "pre-commit>=3.8",
    "sqlglot==30.8.0",
    "types-passlib>=1.7",
    "mutmut>=2.5",
]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert allowed in tests
"alembic/**" = ["E501", "I001", "W291", "W293", "UP035", "UP007", "UP037", "RUF100"]  # generated code
"app/infrastructure/orm_models*.py" = ["F821", "UP037", "RUF100", "E402"]  # ORM cross-refs use string forward refs

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["tests/"]

# ---------------------------------------------------------------------------
# Pytest — test runner + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/infrastructure/orm_models.py",
    "app/routers/*",
    # Legacy backward-compat shims — pure re-exports, no logic to test
    "app/config.py",
    "app/database.py",
    "app/deps.py",
    "app/models.py",
    "app/security.py",
    # Wraps external cappycloud_agent package (not available in test env)
    "app/adapters/secondary/agent/pipeline_adapter.py",
    # HTTP adapter layer (thin glue: parse → call → return) — tested via integration
    "app/adapters/primary/http/conversation_diff.py",
    "app/adapters/primary/http/conversation_files.py",
    "app/adapters/primary/http/conversation_pr.py",
    "app/adapters/primary/http/routines.py",
    "app/adapters/primary/http/tasks.py",
    "app/adapters/primary/http/webhooks.py",
    "app/adapters/primary/http/_webhook_github.py",
    "app/adapters/primary/http/_webhook_gitlab.py",
    "app/adapters/primary/http/_routines_scheduler.py",
    "app/adapters/secondary/persistence/sqlalchemy_repo_env_repo.py",
    "app/adapters/primary/http/environments.py",
    # Skills — adaptadores HTTP testáveis via integração; lógica externa
    # (HTTP scrape, embeddings) requer mocks pesados.
    "app/adapters/primary/http/skills.py",
    "app/adapters/primary/http/skills_search.py",
    "app/adapters/primary/http/git_providers.py",
    "app/adapters/primary/http/repositories_admin.py",
    "app/adapters/primary/http/workspaces.py",
    "app/adapters/primary/http/ai_models.py",
    # Docs de suporte por repositório — HTTP fino; ingest PDF/XLSX/URL + embeddings.
    "app/adapters/primary/http/documents.py",
    "app/infrastructure/document_ingester.py",
    "app/infrastructure/skill_importer.py",
    "app/infrastructure/embeddings.py",
    "app/infrastructure/sandbox_watchdog.py",
    # Anexos (visão computacional) — HTTP/upload, storage filesystem físico,
    # chamada externa OpenRouter Vision. Cobertura via testes de integração
    # (fora do gate de unit-coverage); use cases têm fakes em conftest.py.
    "app/adapters/primary/http/attachments.py",
    "app/adapters/secondary/storage/local_volume_attachment_storage.py",
    "app/adapters/secondary/vision/openrouter_vision_describer.py",
    "app/application/use_cases/attachments.py",
    # MCP Servers — HTTP router + repo adapter + use cases + catálogo externo.
    # Integração com openclaude requer sandbox; cobertura via testes de integração.
    "app/adapters/primary/http/mcp_servers.py",
    "app/adapters/primary/http/mcp_oauth.py",
    "app/adapters/primary/http/repository_mcp.py",
    "app/adapters/primary/http/user_mcp_servers.py",
    "app/adapters/secondary/persistence/sqlalchemy_mcp_repo.py",
    "app/adapters/secondary/persistence/sqlalchemy_user_mcp_repo.py",
    "app/adapters/secondary/repository_mcp_tool_gateway.py",
    "app/adapters/secondary/openrouter_catalog.py",
    "app/application/use_cases/mcp_servers.py",
    "app/application/use_cases/ai_models.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ---------------------------------------------------------------------------
# Mutmut — mutation testing (sob demanda, não roda no CI por padrão)
#
# Foco em módulos onde a lógica de negócio mora — não em DTOs, HTTP adapters
# triviais ou wrappers. Cobertura ampla aqui custaria horas e geraria muito
# mutante equivalente.
#
# Como rodar:
#   pip install -e '.[dev]'
#   mutmut run                       # roda contra paths-to-mutate
#   mutmut results                   # lista sobreviventes
#   mutmut show <id>                 # vê o diff do mutante #<id>
#
# Ver docs/AGENT_RULES.md (seção "Mutation Testing") para política e quando usar.
# ---------------------------------------------------------------------------
[tool.mutmut]
paths_to_mutate = [
    "app/application/use_cases/_stream_helpers.py",
]
tests_dir = ["tests/unit/use_cases/test_stream_helpers.py"]
pytest_add_cli_args = ["-x", "-q", "--no-cov"]
