[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cappy-sql-extractor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["sqlglot==30.8.0"]

[project.scripts]
cappy-sql-extractor = "cappy_sql_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
