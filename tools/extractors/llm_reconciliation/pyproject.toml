[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cappy-llm-reconciliation"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["asyncpg>=0.29.0", "httpx>=0.28.0", "cryptography>=41.0.0"]

[project.scripts]
cappy-llm-reconciliation = "cappy_llm_reconciliation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
