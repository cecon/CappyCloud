repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
        files: ^services/api/
      - id: ruff-format
        files: ^services/api/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: \.patch$
      - id: trailing-whitespace
        exclude: \.patch$
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: max-file-length
        name: "Máximo 300 linhas por arquivo de código"
        entry: python scripts/check_file_length.py
        language: system
        types_or: [python, ts, tsx, javascript, jsx]
        exclude: ^(web/|\.claude/|services/api/alembic/versions/|services/api/app/application/use_cases/conversations\.py|services/api/tests/conftest\.py|services/api/tests/unit/test_agent_runtime_regressions\.py|services/api/tests/unit/use_cases/test_conversation_streaming\.py|services/api/tests/unit/use_cases/test_stream_helpers\.py|services/cappycloud_agent/cappycloud_pipeline\.py|services/sandbox/session_server\.js)
      - id: require-alembic-for-migrations
        name: "Migrations exigem comando alembic"
        entry: python scripts/check_alembic_available_for_migrations.py
        language: python
        additional_dependencies: [alembic==1.18.4]
        files: ^services/api/alembic/versions/.*\.py$
