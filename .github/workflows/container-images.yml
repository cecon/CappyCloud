name: Container Images

on:
  push:
    branches: ["main"]
    paths:
      - "services/api/**"
      - "services/cappycloud_agent/**"
      - "services/sandbox/**"
      - "services/agentmemory/**"
      - "sandbox/**"
      - "web/**"
      - "proto/**"
      - "infra/swarm/**"
      - ".github/workflows/container-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: cecon

jobs:
  # Só reconstrói a imagem cujos arquivos mudaram. Cada build sai com digest
  # novo (as labels levam sha e data), e o redeploy da stack atualiza, e
  # reinicia, todo serviço cujo :latest mudou. Reconstruir tudo derrubava as
  # conversas em andamento nos sandboxes a cada merge, mesmo num ajuste de tela.
  changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any_image: ${{ steps.matrix.outputs.any_image }}
      redeploy: ${{ steps.matrix.outputs.redeploy }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - "services/api/**"
              - "services/cappycloud_agent/**"
              - "proto/**"
            web:
              - "web/**"
            sandbox:
              - "services/sandbox/**"
              - "sandbox/**"
              - "services/cappycloud_agent/_evidence_*.py"
            agentmemory:
              - "services/agentmemory/**"
            stack:
              - "infra/swarm/**"

      - id: matrix
        env:
          # Reconstruir tudo é manual (Run workflow). Mudar só este arquivo não
          # reconstrói nada, para o merge dele não derrubar as conversas.
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
          API: ${{ steps.filter.outputs.api }}
          WEB: ${{ steps.filter.outputs.web }}
          SANDBOX: ${{ steps.filter.outputs.sandbox }}
          AGENTMEMORY: ${{ steps.filter.outputs.agentmemory }}
          STACK: ${{ steps.filter.outputs.stack }}
        # O runner usa bash -e: só `if`, nunca `[ ] && ...` (falso encerra o passo).
        run: |
          items=()
          wants() { [ "$ALL" = true ] || [ "$1" = true ]; }
          if wants "$API"; then
            items+=('{"name":"api","image":"cappycloud-api","dockerfile":"services/api/Dockerfile"}')
          fi
          if wants "$WEB"; then
            items+=('{"name":"web","image":"cappycloud-web","dockerfile":"web/Dockerfile"}')
          fi
          if wants "$SANDBOX"; then
            items+=('{"name":"sandbox","image":"cappycloud-sandbox","dockerfile":"services/sandbox/Dockerfile"}')
          fi
          if wants "$AGENTMEMORY"; then
            items+=('{"name":"agentmemory","image":"cappycloud-agentmemory","dockerfile":"services/agentmemory/Dockerfile","context":"services/agentmemory"}')
          fi
          joined=$(IFS=,; echo "${items[*]}")
          echo "matrix={\"include\":[${joined}]}" >> "$GITHUB_OUTPUT"
          any=false
          if [ ${#items[@]} -gt 0 ]; then any=true; fi
          echo "any_image=${any}" >> "$GITHUB_OUTPUT"
          redeploy=false
          if [ "$any" = true ] || [ "$STACK" = true ]; then redeploy=true; fi
          echo "redeploy=${redeploy}" >> "$GITHUB_OUTPUT"
          echo "Imagens: ${joined:-nenhuma}; redeploy: ${redeploy}"

  build-and-push:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any_image == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  redeploy-dokploy:
    name: Redeploy Dokploy stack
    runs-on: ubuntu-latest
    needs: [changes, build-and-push]
    # Também quando só a stack (infra/swarm) mudou e nenhuma imagem foi construída.
    if: >-
      always() && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && needs.changes.outputs.redeploy == 'true'
      && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')

    steps:
      - name: Trigger Dokploy deploy webhook
        # URL da aba Deployments do compose "cappycloud" no Dokploy
        # (https://painel.linx.cappyfy.com/api/deploy/compose/<token>).
        # O Traefik libera só esse caminho fora da allowlist do painel.
        run: |
          if [ -z "${DOKPLOY_DEPLOY_WEBHOOK_URL}" ]; then
            echo "No Dokploy webhook configured; skipping redeploy."
            exit 0
          fi

          curl --fail --show-error --silent \
            --request POST \
            --retry 3 --retry-delay 5 \
            "${DOKPLOY_DEPLOY_WEBHOOK_URL}"
        env:
          DOKPLOY_DEPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}
