name: Container Images

on:
  push:
    branches: ["main"]
    paths:
      - "services/api/**"
      - "services/cappycloud_agent/**"
      - "services/sandbox/**"
      - "sandbox/**"
      - "web/**"
      - "proto/**"
      - "infra/swarm/**"
      - ".github/workflows/container-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: cecon

jobs:
  build-and-push:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: cappycloud-api
            dockerfile: services/api/Dockerfile
          - name: web
            image: cappycloud-web
            dockerfile: web/Dockerfile
          - name: sandbox
            image: cappycloud-sandbox
            dockerfile: services/sandbox/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  redeploy-portainer:
    name: Redeploy Portainer stack
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Portainer webhook
        run: |
          if [ -z "${PORTAINER_WEBHOOK_URL}" ]; then
            echo "PORTAINER_WEBHOOK_URL is not configured; skipping Portainer redeploy."
            exit 0
          fi

          curl --fail --show-error --silent \
            --request POST \
            "${PORTAINER_WEBHOOK_URL}"
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
